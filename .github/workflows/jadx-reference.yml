name: Analyze reference APK with JADX
# Re-run this workflow whenever the reference APK analysis needs refreshing.

on:
  push:
    paths:
      - ".github/workflows/jadx-reference.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jadx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JADX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jadx"
          release_json="$RUNNER_TEMP/jadx/release.json"
          curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest -o "$release_json"
          url="$(jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' "$release_json" | head -n1)"
          test -n "$url"
          curl -fL "$url" -o "$RUNNER_TEMP/jadx/jadx.zip"
          unzip -q "$RUNNER_TEMP/jadx/jadx.zip" -d "$RUNNER_TEMP/jadx"
          JADX_BIN="$(find "$RUNNER_TEMP/jadx" -type f -path "*/bin/jadx" -print -quit)"
          test -n "$JADX_BIN"
          chmod +x "$JADX_BIN"
          echo "JADX_BIN=$JADX_BIN" >> "$GITHUB_ENV"

      - name: Decompile APK and extract behavior
        shell: bash
        run: |
          set -euo pipefail

          apk="$(find ss -maxdepth 1 -type f -name 'Bubble_ Fast Floating Browser 1.9.apk+' -print -quit)"
          test -n "$apk"
          cp "$apk" "$RUNNER_TEMP/reference.apk"
          apk="$RUNNER_TEMP/reference.apk"

          rm -rf "$RUNNER_TEMP/decompiled" reference-analysis
          mkdir -p reference-analysis

          "$JADX_BIN" \
            --deobf \
            --deobf-use-sourcename \
            --show-bad-code \
            --threads-count 2 \
            -d "$RUNNER_TEMP/decompiled" \
            "$apk" > reference-analysis/jadx-console.txt 2>&1

          source_dir="$(find "$RUNNER_TEMP/decompiled" -type d -name sources -print -quit)"
          resource_dir="$(find "$RUNNER_TEMP/decompiled" -type d -name resources -print -quit)"
          test -n "$source_dir"
          test -n "$resource_dir"

          echo "=== APK FILE ===" > reference-analysis/apk-info.txt
          stat "$apk" >> reference-analysis/apk-info.txt
          sha256sum "$apk" >> reference-analysis/apk-info.txt

          echo "=== SOURCE FILE INDEX ===" > reference-analysis/source-index.txt
          find "$source_dir" -type f \( -name '*.java' -o -name '*.kt' \) | sort >> reference-analysis/source-index.txt
          test -s reference-analysis/source-index.txt

          echo "=== TARGETED CLASS INDEX ===" > reference-analysis/targeted-class-index.txt
          grep -RIl -E 'WindowManager|TYPE_APPLICATION_OVERLAY|SYSTEM_ALERT_WINDOW|AccessibilityService|MotionEvent|GestureDetector|VelocityTracker|snap|dock|edge|drag|close|resize|minimi|expand|bubble|floating|chat.?head|WebView|ForegroundService|startForeground|Notification|service' "$source_dir" | sort >> reference-analysis/targeted-class-index.txt || true

          echo "=== MANIFEST ===" > reference-analysis/AndroidManifest.xml.txt
          manifest="$(find "$resource_dir" -name AndroidManifest.xml -print -quit)"
          if test -n "$manifest"; then cat "$manifest" >> reference-analysis/AndroidManifest.xml.txt; fi

          echo "=== TARGETED SOURCE CONTENT ===" > reference-analysis/targeted-source.txt
          while IFS= read -r file; do
            echo >> reference-analysis/targeted-source.txt
            echo "================================================================" >> reference-analysis/targeted-source.txt
            echo "FILE: $file" >> reference-analysis/targeted-source.txt
            echo "================================================================" >> reference-analysis/targeted-source.txt
            cat "$file" >> reference-analysis/targeted-source.txt
          done < reference-analysis/targeted-class-index.txt

          echo "=== RELEVANT RESOURCE STRINGS ===" > reference-analysis/relevant-resources.txt
          values_dir="$(find "$resource_dir" -type d -name values -print -quit)"
          if test -n "$values_dir"; then
            grep -Rni -E 'bubble|floating|browser|chat.?head|minimi|expand|close|drag|move|resize|tab|new tab|settings|home|back|forward|refresh|download|incognito|desktop|mobile|share' "$values_dir" >> reference-analysis/relevant-resources.txt || true
          fi

          echo "=== WINDOW / TOUCH / SERVICE SYMBOLS ===" > reference-analysis/symbol-hits.txt
          grep -Rni -E 'WindowManager\.LayoutParams|TYPE_APPLICATION_OVERLAY|TYPE_PHONE|TYPE_SYSTEM_ALERT|FLAG_NOT_FOCUSABLE|FLAG_NOT_TOUCH_MODAL|FLAG_LAYOUT_IN_SCREEN|FLAG_ALT_FOCUSABLE_IM|onTouchEvent|setOnTouchListener|ACTION_DOWN|ACTION_MOVE|ACTION_UP|ACTION_CANCEL|VelocityTracker|GestureDetector|OVERLAY|BUBBLE|FLOAT|SERVICE|NOTIFICATION' "$source_dir" >> reference-analysis/symbol-hits.txt || true

      - name: Commit analysis report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reference-analysis
          if git diff --cached --quiet; then
            echo "No report changes."
            exit 0
          fi

          git commit -m "Analyze reference APK with JADX"
          git push
