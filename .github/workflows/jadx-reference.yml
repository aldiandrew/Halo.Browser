name: Analyze reference APK with JADX

on:
  push:
    paths:
      - ".github/workflows/jadx-reference.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jadx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JADX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jadx"
          release_json="$RUNNER_TEMP/jadx/release.json"
          curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest -o "$release_json"
          url="$(jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' "$release_json" | head -n1)"
          test -n "$url"
          curl -fL "$url" -o "$RUNNER_TEMP/jadx/jadx.zip"
          unzip -q "$RUNNER_TEMP/jadx/jadx.zip" -d "$RUNNER_TEMP/jadx"
          JADX_BIN="$(find "$RUNNER_TEMP/jadx" -type f -path "*/bin/jadx" -print -quit)"
          test -n "$JADX_BIN"
          chmod +x "$JADX_BIN"
          echo "JADX_BIN=$JADX_BIN" >> "$GITHUB_ENV"
          "$JADX_BIN" --version | tee reference-analysis-jadx-version.txt

      - name: Inspect APK and extract DEX files
        shell: bash
        run: |
          set -euo pipefail

          apk="$(find ss -maxdepth 1 -type f -name 'Bubble_ Fast Floating Browser 1.9.apk+' -print -quit)"
          test -n "$apk"
          cp "$apk" "$RUNNER_TEMP/reference.apk"
          apk="$RUNNER_TEMP/reference.apk"

          rm -rf reference-analysis "$RUNNER_TEMP/reference-apk" "$RUNNER_TEMP/dex-inputs" "$RUNNER_TEMP/decompiled-apk" "$RUNNER_TEMP/decompiled-dex"
          mkdir -p reference-analysis "$RUNNER_TEMP/reference-apk" "$RUNNER_TEMP/dex-inputs" "$RUNNER_TEMP/decompiled-apk" "$RUNNER_TEMP/decompiled-dex"

          echo "=== APK FILE ===" > reference-analysis/apk-info.txt
          stat "$apk" >> reference-analysis/apk-info.txt
          sha256sum "$apk" >> reference-analysis/apk-info.txt

          echo "=== ZIP TEST ===" > reference-analysis/apk-zip-test.txt
          unzip -t "$apk" >> reference-analysis/apk-zip-test.txt

          echo "=== APK ARCHIVE ===" > reference-analysis/apk-archive-index.txt
          unzip -Z1 "$apk" | sort >> reference-analysis/apk-archive-index.txt

          echo "=== DEX FILES ===" > reference-analysis/dex-index.txt
          unzip -Z1 "$apk" | grep -E '^classes([0-9]+)?\.dex$' | sort -V | tee -a reference-analysis/dex-index.txt

          dex_count="$(grep -Ec '^classes([0-9]+)?\.dex$' reference-analysis/dex-index.txt || true)"
          echo "DEX_COUNT=$dex_count" >> reference-analysis/dex-index.txt
          test "$dex_count" -gt 0

          while IFS= read -r dex_name; do
            base="$(basename "$dex_name")"
            unzip -p "$apk" "$dex_name" > "$RUNNER_TEMP/dex-inputs/$base"
            test -s "$RUNNER_TEMP/dex-inputs/$base"
            stat "$RUNNER_TEMP/dex-inputs/$base" >> reference-analysis/dex-files-stat.txt
          done < <(grep -E '^classes([0-9]+)?\.dex$' reference-analysis/dex-index.txt)

          echo "=== MANIFEST / RESOURCE FILES ===" > reference-analysis/apk-special-files.txt
          unzip -Z1 "$apk" | grep -E '(^|/)(AndroidManifest\.xml|resources\.arsc)$' | sort >> reference-analysis/apk-special-files.txt || true

      - name: Decompile APK and DEX separately
        shell: bash
        run: |
          set -euo pipefail

          apk="$RUNNER_TEMP/reference.apk"

          echo "=== JADX VERSION ===" > reference-analysis/jadx-console.txt
          "$JADX_BIN" --version >> reference-analysis/jadx-console.txt 2>&1 || true

          echo >> reference-analysis/jadx-console.txt
          echo "=== JADX APK INPUT ===" >> reference-analysis/jadx-console.txt
          set +e
          "$JADX_BIN" \
            --show-bad-code \
            --threads-count 2 \
            -d "$RUNNER_TEMP/decompiled-apk" \
            "$apk" >> reference-analysis/jadx-console.txt 2>&1
          apk_exit=$?
          set -e
          echo "APK_EXIT_CODE=$apk_exit" >> reference-analysis/jadx-console.txt

          echo "=== APK DECOMPILE FILE COUNTS ===" > reference-analysis/decompile-counts.txt
          apk_java_count="$(find "$RUNNER_TEMP/decompiled-apk" -type f \( -name '*.java' -o -name '*.kt' \) 2>/dev/null | wc -l)"
          echo "APK_JAVA_KT_COUNT=$apk_java_count" | tee -a reference-analysis/decompile-counts.txt

          : > reference-analysis/jadx-dex-console.txt

          mapfile -t dex_files < <(find "$RUNNER_TEMP/dex-inputs" -maxdepth 1 -type f -name 'classes*.dex' | sort -V)
          test "${#dex_files[@]}" -gt 0

          for dex in "${dex_files[@]}"; do
            base="$(basename "$dex" .dex)"
            out="$RUNNER_TEMP/decompiled-dex/$base"
            mkdir -p "$out"

            {
              echo "=== INPUT: $dex ==="
              stat "$dex"
              echo "--- JADX OUTPUT ---"
            } >> reference-analysis/jadx-dex-console.txt

            set +e
            "$JADX_BIN" \
              --show-bad-code \
              --threads-count 2 \
              -d "$out" \
              "$dex" >> reference-analysis/jadx-dex-console.txt 2>&1
            dex_exit=$?
            set -e

            echo "DEX_EXIT_CODE=$dex_exit" >> reference-analysis/jadx-dex-console.txt
            count="$(find "$out" -type f \( -name '*.java' -o -name '*.kt' \) 2>/dev/null | wc -l)"
            echo "DEX_SOURCE_COUNT=$count" >> reference-analysis/jadx-dex-console.txt
            echo >> reference-analysis/jadx-dex-console.txt
          done

          echo "=== DEX SOURCE COUNTS ===" >> reference-analysis/decompile-counts.txt
          find "$RUNNER_TEMP/decompiled-dex" -type f \( -name '*.java' -o -name '*.kt' \) | sort | awk -F/ '
            {
              for (i=1;i<=NF;i++) if ($i=="decompiled-dex") {print $(i+1); next}
            }
          ' | sort | uniq -c >> reference-analysis/decompile-counts.txt || true

          find "$RUNNER_TEMP/decompiled-apk" "$RUNNER_TEMP/decompiled-dex" -type f \( -name '*.java' -o -name '*.kt' \) | sort > reference-analysis/all-decompiled-source-index.txt

          total="$(wc -l < reference-analysis/all-decompiled-source-index.txt)"
          echo "TOTAL_DECOMPILED_SOURCES=$total" >> reference-analysis/decompile-counts.txt

          test "$total" -gt 0

      - name: Build reference structure report
        shell: bash
        run: |
          set -euo pipefail

          source_root="$RUNNER_TEMP/decompiled-dex"
          echo "=== DEX PACKAGE / CLASS STRUCTURE ===" > reference-analysis/package-class-index.txt

          find "$source_root" -type f -name '*.java' | sort | while IFS= read -r file; do
            rel="${file#"$source_root"/}"
            pkg="$(grep -m1 '^package ' "$file" | sed 's/^package //; s/;//' || true)"
            cls="$(grep -m1 -E '^[[:space:]]*(public |private |protected )?(final |abstract )?(class|interface|enum) ' "$file" | sed -E 's/^[[:space:]]*(public |private |protected )?//; s/^(final |abstract )?//; s/^(class|interface|enum) //; s/[ {].*$//' || true)"
            printf '%s | %s | %s\n' "${pkg:-<no-package>}" "${cls:-<unknown-class>}" "$rel"
          done | sort >> reference-analysis/package-class-index.txt

          echo "=== ANDROID/BUBBLE RELATED SOURCE FILES ===" > reference-analysis/targeted-class-index.txt
          grep -RIl -E 'WindowManager|TYPE_APPLICATION_OVERLAY|SYSTEM_ALERT_WINDOW|AccessibilityService|MotionEvent|GestureDetector|VelocityTracker|snap|dock|edge|drag|close|resize|minimi|expand|bubble|floating|chat.?head|WebView|ForegroundService|startForeground|Notification|service|Spring|physics|fling|touch|browser.?manager' "$source_root" | sort >> reference-analysis/targeted-class-index.txt || true

          echo "=== TARGETED SOURCE CONTENT ===" > reference-analysis/targeted-source.txt
          while IFS= read -r file; do
            echo >> reference-analysis/targeted-source.txt
            echo "================================================================" >> reference-analysis/targeted-source.txt
            echo "FILE: $file" >> reference-analysis/targeted-source.txt
            echo "================================================================" >> reference-analysis/targeted-source.txt
            cat "$file" >> reference-analysis/targeted-source.txt
          done < <(tail -n +2 reference-analysis/targeted-class-index.txt)

          echo "=== TARGETED SYMBOL HITS ===" > reference-analysis/symbol-hits.txt
          grep -Rni -E 'WindowManager\.LayoutParams|TYPE_APPLICATION_OVERLAY|TYPE_PHONE|TYPE_SYSTEM_ALERT|FLAG_NOT_FOCUSABLE|FLAG_NOT_TOUCH_MODAL|FLAG_LAYOUT_IN_SCREEN|FLAG_ALT_FOCUSABLE_IM|onTouchEvent|setOnTouchListener|ACTION_DOWN|ACTION_MOVE|ACTION_UP|ACTION_CANCEL|VelocityTracker|GestureDetector|OVERLAY|BUBBLE|FLOAT|SERVICE|NOTIFICATION|Spring|spring|fling|translationX|translationY|x|y' "$source_root" >> reference-analysis/symbol-hits.txt || true

          echo "=== ALL SERVICE / MANAGER / CHATHEAD NAMES ===" > reference-analysis/component-hints.txt
          find "$source_root" -type f -name '*.java' | grep -Ei '(service|manager|chat|head|bubble|floating|overlay|browser|tab|webview|gesture|drag|spring|touch|notification)' | sort >> reference-analysis/component-hints.txt || true

          echo "=== SOURCE ROOTS ===" > reference-analysis/source-roots.txt
          find "$RUNNER_TEMP" -type d \( -name sources -o -name decompiled-dex -o -name decompiled-apk \) | sort >> reference-analysis/source-roots.txt

      - name: Commit analysis report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reference-analysis
          git add reference-analysis-jadx-version.txt
          if git diff --cached --quiet; then
            echo "No report changes."
            exit 0
          fi

          git commit -m "Rebuild reference APK decompile analysis"
          git push
