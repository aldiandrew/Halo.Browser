name: Extract reference browser source

on:
  push:
    paths:
      - ".github/workflows/extract-reference.yml"
      - "reference-analysis/targeted-source.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract classes from existing JADX report
        shell: bash
        run: |
          set -euo pipefail
          test -s reference-analysis/targeted-source.txt
          rm -rf reference-source
          mkdir -p reference-source

          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path("reference-analysis/targeted-source.txt")
          out = Path("reference-source")
          wanted = (
              "com/bubble/browser/pro/",
              "com/flipkart/chatheads/ui/",
          )
          skip = {
              "com/bubble/browser/pro/AdDisplayActivity.java",
          }

          marker = re.compile(r"^FILE: (.+)$")
          current = None
          buf = []

          def flush(path, data):
              if not path or not data:
                  return
              p = path.replace("\\", "/")
              if not any(p.endswith(x) or x in p for x in wanted):
                  return
              if p.lstrip("/") in skip:
                  return
              rel = p.split("/sources/", 1)[-1]
              if not any(rel.startswith(x) for x in wanted):
                  return
              dst = out / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              text = "".join(data)
              if text.startswith("="):
                  lines = text.splitlines(True)
                  text = "".join(lines[1:]) if lines else text
              dst.write_text(text, encoding="utf-8")

          for line in src.open(encoding="utf-8", errors="replace"):
              m = marker.match(line.rstrip("\n"))
              if m:
                  flush(current, buf)
                  current = m.group(1)
                  buf = []
              elif current is not None:
                  if line.startswith("================================================================") and not buf:
                      continue
                  buf.append(line)

          flush(current, buf)

          files = sorted(str(p) for p in out.rglob("*.java"))
          if not files:
              raise SystemExit("No reference app classes extracted")
          print("\n".join(files))
          PY

          rm -f reference-source/com/bubble/browser/pro/AdDisplayActivity.java
          cat > reference-source/README.md <<'EOF'
          # Reference source reconstruction

          Decompiled equivalent source extracted from the reference APK analysis.
          Advertising activity is intentionally excluded.
          EOF

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference-source
          git commit -m "Extract reference browser classes without ads" || exit 0
          git push
