name: Build Halo Browser

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile-reference:
    name: Decompile reference APK with JADX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JADX
        shell: bash
        run: |
          set -euo pipefail
          if command -v jadx >/dev/null 2>&1; then
            jadx --version
            exit 0
          fi

          sudo apt-get update
          if sudo apt-get install -y jadx; then
            jadx --version
            exit 0
          fi

          JADX_VERSION="1.5.2"
          curl -fL --retry 3 --retry-all-errors \
            "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip" \
            -o /tmp/jadx.zip
          sudo rm -rf /opt/jadx
          sudo mkdir -p /opt/jadx
          sudo unzip -q /tmp/jadx.zip -d /opt/jadx
          sudo ln -sf /opt/jadx/bin/jadx /usr/local/bin/jadx
          sudo chmod +x /opt/jadx/bin/jadx
          jadx --version

      - name: Locate reference APK
        shell: bash
        run: |
          set -euo pipefail
          REF=$(find ss -maxdepth 1 -type f -name 'Bubble*1.9.apk*' -print -quit || true)
          if [ -z "$REF" ]; then
            echo "Reference APK not found under ss/"
            find ss -maxdepth 1 -type f -print || true
            exit 1
          fi
          echo "REFERENCE_APK=$REF" >> "$GITHUB_ENV"
          ls -lh "$REF"
          file "$REF"

      - name: Decompile reference APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reference-decompiled
          mkdir -p reference-decompiled
          jadx \
            --show-bad-code \
            --deobf \
            --deobf-use-sourcename \
            --deobf-parse-kotlin-metadata \
            --threads-count 2 \
            --output-dir reference-decompiled \
            "$REFERENCE_APK"

      - name: Inventory decompiled source
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Decompiled tree ==="
          find reference-decompiled -type f | sort
          echo "=== Likely bubble/browser classes ==="
          find reference-decompiled -type f \
            \( -name '*ChatHead*' -o -name '*BrowserTab*' -o -name '*DataManager*' -o -name '*Floating*' \) \
            -print | sort || true

      - name: Upload full JADX source
        uses: actions/upload-artifact@v4
        with:
          name: Bubble-Fast-Floating-Browser-1.9-jadx
          path: reference-decompiled/
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build Halo Browser
    runs-on: ubuntu-latest
    needs: decompile-reference

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Halo-Browser-debug
          path: app/build/outputs/apk/debug/app-debug.apk
