name: Decompile reference APK

on:
  push:
    paths:
      - ".github/workflows/decompile-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JADX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jadx"
          url="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' | head -n1)"
          test -n "$url"
          curl -fL "$url" -o "$RUNNER_TEMP/jadx/jadx.zip"
          unzip -q "$RUNNER_TEMP/jadx/jadx.zip" -d "$RUNNER_TEMP/jadx"
          chmod +x "$RUNNER_TEMP/jadx"/jadx/bin/jadx

      - name: Decompile reference
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find ss -maxdepth 1 -type f -name 'Bubble_ Fast Floating Browser 1.9.apk+' -print -quit)"
          test -n "$apk"
          rm -rf "$RUNNER_TEMP/decompiled"
          "$RUNNER_TEMP/jadx"/jadx/bin/jadx             --deobf             --deobf-use-sourcename             --show-bad-code             -d "$RUNNER_TEMP/decompiled"             "$apk" || true

          mkdir -p reference-report

          find "$RUNNER_TEMP/decompiled" -type f | sort > reference-report/file-list.txt
          if [ -f "$RUNNER_TEMP/decompiled/resources/AndroidManifest.xml" ]; then
            cp "$RUNNER_TEMP/decompiled/resources/AndroidManifest.xml" reference-report/AndroidManifest.xml
          fi

          {
            echo "=== APK ==="
            stat "$apk"
            echo
            echo "=== DEX / RESOURCE COUNTS ==="
            find "$RUNNER_TEMP/decompiled" -maxdepth 2 -type f | sed 's#.*\.##' | sort | uniq -c || true
            echo
            echo "=== OVERLAY / BUBBLE / WINDOW / GESTURE REFERENCES ==="
            rg -n -i -C 8               'SYSTEM_ALERT_WINDOW|TYPE_APPLICATION_OVERLAY|WindowManager|LayoutParams|BubbleMetadata|Notification.Bubble|AccessibilityService|onTouch|MotionEvent|ACTION_(DOWN|UP|MOVE|CANCEL)|GestureDetector|VelocityTracker|snap|drag|dock|edge|close|resize|minimi|expand|overlay|floating|bubble|WebView|CustomTabs|foreground'               "$RUNNER_TEMP/decompiled/sources"               > reference-report/targeted-behavior.txt || true
            echo
            echo "=== MANIFEST PERMISSIONS / COMPONENTS ==="
            rg -n -i               'uses-permission|service|activity|receiver|provider|SYSTEM_ALERT_WINDOW|FOREGROUND_SERVICE|POST_NOTIFICATIONS|QUERY_ALL_PACKAGES|WAKE_LOCK|INTERNET|ACCESS_NETWORK_STATE'               "$RUNNER_TEMP/decompiled/resources/AndroidManifest.xml"               > reference-report/manifest-components.txt || true
            echo
            echo "=== HUMAN-READABLE STRINGS ==="
            rg -n -i               'bubble|floating|browser|minimi|expand|close|drag|move|resize|tab|new tab|settings|home|back|forward|refresh|download|incognito|desktop|mobile|share'               "$RUNNER_TEMP/decompiled/resources/values"               > reference-report/ui-strings.txt || true
          } > reference-report/analysis.txt

          cp -a "$RUNNER_TEMP/decompiled" ./decompiled-reference

      - name: Upload decompiled reference
        uses: actions/upload-artifact@v4
        with:
          name: bubble-reference-decompiled
          path: |
            decompiled-reference
            reference-report
          if-no-files-found: error
