name: Inspect reference Bubble Browser APK

on:
  push:
    paths:
      - "ss/Bubble_ Fast Floating Browser 1.9.apk+"
      - ".github/workflows/inspect-reference.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download reference package
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/aldiandrew/Halo.Browser/main/ss/Bubble_%20Fast%20Floating%20Browser%201.9.apk%2B" \
            -o reference-package
          file reference-package
          unzip -l reference-package
          mkdir -p extracted
          unzip -o reference-package -d extracted >/dev/null
          file extracted/base.apk

      - name: Inspect base APK
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          AAPT="$(find "$SDK/build-tools" -name aapt -type f | sort -V | tail -1)"
          AAPT2="$(find "$SDK/build-tools" -name aapt2 -type f | sort -V | tail -1)"
          APKANALYZER="$(find "$SDK/cmdline-tools" -path '*/bin/apkanalyzer' -type f | head -1)"
          mkdir -p report
          echo "AAPT=$AAPT" | tee report/tools.txt
          echo "AAPT2=$AAPT2" | tee -a report/tools.txt
          echo "APKANALYZER=$APKANALYZER" | tee -a report/tools.txt
          "$AAPT" dump badging extracted/base.apk > report/base-badging.txt
          "$AAPT" dump permissions extracted/base.apk > report/base-permissions.txt
          "$APKANALYZER" manifest permissions extracted/base.apk > report/base-apkanalyzer-permissions.txt
          "$APKANALYZER" manifest print extracted/base.apk > report/base-manifest.xml
          "$APKANALYZER" dex packages extracted/base.apk > report/base-dex-packages.txt || true
          unzip -p extracted/base.apk classes.dex 2>/dev/null | strings | \
            grep -Ei 'SYSTEM_ALERT_WINDOW|TYPE_APPLICATION_OVERLAY|WindowManager|AccessibilityService|Notification|BubbleMetadata|startForeground|startService|Floating|overlay|bubble|Browser' \
            > report/base-dex-string-hits.txt || true
          echo "=== APK BADGING ==="
          cat report/base-badging.txt
          echo "=== PERMISSIONS ==="
          cat report/base-permissions.txt
          echo "=== MANIFEST COMPONENTS/HITS ==="
          grep -Ei 'activity|service|receiver|permission|SYSTEM_ALERT_WINDOW|FOREGROUND_SERVICE|overlay|bubble' report/base-manifest.xml || true
          echo "=== DEX PACKAGES ==="
          cat report/base-dex-packages.txt || true
          echo "=== DEX STRINGS ==="
          cat report/base-dex-string-hits.txt || true


      - name: Decompile base APK with JADX
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip" \
            -o jadx.zip
          unzip -q jadx.zip -d jadx
          mkdir -p decompiled
          ./jadx/bin/jadx --deobf --show-bad-code -d decompiled extracted/base.apk > /tmp/jadx.log 2>&1 || true

          mkdir -p report/decompiled
          find decompiled -type f | grep -E '/(ChatHeadService|FloatingActivity|PermissionActivity|IntroActivity)\.(java|kt)
        uses: actions/upload-artifact@v4
        with:
          name: reference-base-apk-inspection
          path: report/ | while read -r f; do
            echo "=== $f ==="
            cp "$f" report/decompiled/
            sed -n '1,420p' "$f" || true
          done

          grep -RIlE 'SYSTEM_ALERT_WINDOW|TYPE_APPLICATION_OVERLAY|WindowManager|addView|removeView|ChatHead|FloatingActivity' decompiled \
            | head -40 > report/relevant-source-files.txt || true

          while read -r f; do
            cp --parents "$f" report/decompiled/ 2>/dev/null || true
          done < report/relevant-source-files.txt
          echo "=== RELEVANT SOURCE FILES ==="
          cat report/relevant-source-files.txt || true

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: reference-base-apk-inspection
          path: report/